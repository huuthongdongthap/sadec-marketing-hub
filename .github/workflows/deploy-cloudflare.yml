name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check Cloudflare credentials
        id: check-creds
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
            echo "✅ CLOUDFLARE_API_TOKEN configured"
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::warning ::CLOUDFLARE_API_TOKEN secret is not set in repository settings. Cloudflare Pages deploy step skipped."
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.check-creds.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=sadec-marketing-hub --branch=main

      - name: Smoke test
        run: |
          HTTP_STATUS=$(curl -s -L "https://sadec-marketing-hub.pages.dev/partnership" -o /dev/null -w '%{http_code}' 2>/dev/null || echo "000")
          echo "Health check (partnership): HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Deploy verified — site and partnership portal are live!"
          else
            echo "⚠️  HTTP $HTTP_STATUS — check Cloudflare status"
          fi
